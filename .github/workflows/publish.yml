name: Publish Dart Zvec

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: publish-dart-zvec
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dart-packages
    env:
      PUB_REPOSITORY_URL: https://pub.hippolabs.org
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run melos run ci
      - name: Validate package archive
        run: dart pub publish --dry-run
        working-directory: packages/dart_zvec
      - name: Configure registry token
        if: ${{ !inputs.dry_run }}
        env:
          PUB_TOKEN: ${{ secrets.PUB_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUB_TOKEN:-}" ]; then
            echo 'Set PUB_CREDENTIALS in this repository or its dart-packages environment.' >&2
            exit 1
          fi
          dart pub token add "$PUB_REPOSITORY_URL" --env-var PUB_TOKEN
      - name: Publish package
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: >-
          dart run melos publish
          --scope=dart_zvec
          --no-private
          --no-published
          --no-dry-run
          --no-git-tag-version
          --server="$PUB_REPOSITORY_URL"
          --yes
