name: Validate Dart Zvec

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        # Blacksmith runners for every native asset this package can test:
        # Linux x64/arm64, macOS arm64 and Windows x64.
        os:
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-2vcpu-ubuntu-2404-arm
          - blacksmith-6vcpu-macos-15
          - blacksmith-2vcpu-windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Select the MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # Same command the publish workflow uses, so toolchain problems show up here.
      - name: Build and verify the native registry
        shell: bash
        working-directory: packages/dart_zvec
        run: dart tool/build_registry.dart --verify --out "$RUNNER_TEMP/registry"
      - run: dart pub get
      - run: dart run melos run ci
      - if: matrix.os == 'blacksmith-2vcpu-ubuntu-2404'
        run: dart pub publish --dry-run
        working-directory: packages/dart_zvec
